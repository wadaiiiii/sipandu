<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b56">
    <title>SiPANDU — Offline</title>
    <style>
        :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04153a;color:#fff;padding:24px}
        .card{width:min(520px,100%);border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(145deg,#071b56,#0d48cf);padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
        .icon{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#fff;color:#071b56;font-size:28px;font-weight:800}
        h1{margin:22px 0 8px;font-size:28px}p{margin:0;color:#dbeafe;line-height:1.7}button{margin-top:24px;border:0;border-radius:16px;background:#fff;color:#08205d;padding:12px 18px;font-weight:800;cursor:pointer}
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">S</div>
        <h1>SiPANDU sedang offline</h1>
        <p>Koneksi internet diperlukan untuk membuka data kelas, tugas, nilai, dan aktivitas terbaru. Data privat SiPANDU tidak disimpan ke cache offline.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
