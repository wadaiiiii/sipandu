name: SiPANDU CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'work/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sipandu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP formatting
        run: vendor/bin/pint

      - name: Backend tests
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install

      - name: Type check
        run: npm run types:check

      - name: Build frontend
        run: npm run build

      - name: Upload public build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sipandu-public-build-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 14
