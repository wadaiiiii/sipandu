name: One-time SiPANDU Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-production-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: sipandu-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build current main and deploy prebuilt to Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_SCOPE: andiseppewali-3458s-projects
      VERCEL_PROJECT: sipandumath
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::GitHub Secret VERCEL_TOKEN is missing."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build production in GitHub
        run: vercel build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        run: vercel deploy --prebuilt --prod --archive=tgz --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify production and SSO redirect
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 15 https://sipandumath.vercel.app/healthz >/dev/null; then
              headers="$(curl -sS --connect-timeout 10 --max-time 20 -D - -o /dev/null https://sipandumath.vercel.app/sso/start)"
              status="$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}')"
              location="$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}')"
              if printf '%s' "$status" | grep -Eq '^(301|302|303|307|308)$' \
                && printf '%s' "$location" | grep -q '^https://simatrps\.vercel\.app/sso/authorize?'; then
                echo "Production and SSO redirect verified."
                exit 0
              fi
              echo "Health OK but SSO redirect not updated yet: $status $location"
            fi
            echo "Waiting for production... attempt $attempt/18"
            sleep 5
          done
          echo "::error::Production SSO redirect did not become ready."
          exit 1
