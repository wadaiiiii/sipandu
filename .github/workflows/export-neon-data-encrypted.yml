name: Export Neon application data encrypted for UNSULBAR MySQL

on:
  push:
    branches: [ops/export-vercel-env-encrypted]
    paths: ['.github/workflows/export-neon-data-encrypted.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      VERCEL_SCOPE: andiseppewali-3458s-projects
      VERCEL_PROJECT: sipandumath
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TRANSFER_PUBLIC_KEY_B64: 

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production environment safely
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo '::error::VERCEL_TOKEN missing'; exit 1; }
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          vercel env pull /tmp/sipandu-production.env --environment=production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import ast
          vals={}
          for raw in Path('/tmp/sipandu-production.env').read_text(encoding='utf-8').splitlines():
              if '=' not in raw or raw.lstrip().startswith('#'): continue
              k,v=raw.split('=',1); k=k.strip(); v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in "\"'":
                  try: v=ast.literal_eval(v)
                  except Exception: v=v[1:-1]
              vals[k]=v
          db=next((vals.get(k,'') for k in ('DATABASE_URL','POSTGRES_URL','DB_URL') if vals.get(k,'')), '')
          if not db.startswith(('postgres://','postgresql://')): raise SystemExit('No usable PostgreSQL URL')
          Path('/tmp/dburl').write_text(db, encoding='utf-8')
          PY
          DB_URL="$(cat /tmp/dburl)"
          echo '::add-mask::'"$DB_URL"
          echo 'VERCEL_DATABASE_URL_READY=YES'

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Export application rows without logging contents
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat /tmp/dburl)"
          export PGCONNECT_TIMEOUT=12
          EXPORT_DIR=/tmp/sipandu-neon-export
          rm -rf "$EXPORT_DIR" && mkdir -p "$EXPORT_DIR/tables"
          TABLES="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "select tablename from pg_tables where schemaname='public' and tablename <> 'migrations' order by tablename")"
          COUNT=0
          TOTAL=0
          MANIFEST_TMP="$EXPORT_DIR/manifest.rows"
          : > "$MANIFEST_TMP"
          while IFS= read -r table; do
            [ -n "$table" ] || continue
            safe_table="$(printf '%s' "$table" | tr -cd 'A-Za-z0-9_')"
            [ "$safe_table" = "$table" ] || { echo 'Unsafe table name'; exit 2; }
            psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "select row_to_json(t)::text from (select * from public.\"$table\") t" > "$EXPORT_DIR/tables/$table.jsonl"
            rows="$(wc -l < "$EXPORT_DIR/tables/$table.jsonl" | tr -d ' ')"
            printf '%s\t%s\n' "$table" "$rows" >> "$MANIFEST_TMP"
            echo "EXPORT_TABLE=$table ROWS=$rows"
            COUNT=$((COUNT+1)); TOTAL=$((TOTAL+rows))
          done <<< "$TABLES"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/sipandu-neon-export')
          tables=[]
          total=0
          for line in (root/'manifest.rows').read_text().splitlines():
              name,count=line.split('\t')
              count=int(count)
              tables.append({'name':name,'rows':count})
              total+=count
          manifest={'format':'sipandu-neon-jsonl-v1','tables':tables,'table_count':len(tables),'total_rows':total}
          (root/'manifest.json').write_text(json.dumps(manifest,separators=(',',':')),encoding='utf-8')
          (root/'manifest.rows').unlink()
          PY
          echo "EXPORT_TABLE_COUNT=$COUNT"
          echo "EXPORT_TOTAL_ROWS=$TOTAL"
          [ "$TOTAL" -eq 83 ] || { echo '::error::Unexpected source row total'; exit 3; }

      - name: Encrypt export bundle for hosting-only private key
        shell: bash
        run: |
          set -euo pipefail
          tar -C /tmp/sipandu-neon-export -czf /tmp/sipandu-neon-data.tgz .
          KEY_HEX="$(openssl rand -hex 32)"
          IV_HEX="$(openssl rand -hex 16)"
          printf '%s\n%s\n' "$KEY_HEX" "$IV_HEX" > /tmp/sipandu-key-material.txt
          chmod 600 /tmp/sipandu-key-material.txt
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/sipandu-neon-data.tgz -out /tmp/sipandu-neon-data.enc
          printf '%s' "$TRANSFER_PUBLIC_KEY_B64" | base64 -d > /tmp/sipandu-transfer-public.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/sipandu-transfer-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in /tmp/sipandu-key-material.txt -out /tmp/sipandu-key-material.enc
          echo "ENCRYPTED_BUNDLE_BYTES=$(wc -c < /tmp/sipandu-neon-data.enc | tr -d ' ')"
          printf 'SIPANDU_DATA_BUNDLE_B64='; base64 -w 0 /tmp/sipandu-neon-data.enc; echo
          printf 'SIPANDU_DATA_KEY_B64='; base64 -w 0 /tmp/sipandu-key-material.enc; echo
          printf 'SIPANDU_DATA_SHA256='; sha256sum /tmp/sipandu-neon-data.enc | awk '{print $1}'
          echo 'ENCRYPTED_DATA_EXPORT_DONE=YES'
          shred -u /tmp/dburl /tmp/sipandu-production.env /tmp/sipandu-key-material.txt /tmp/sipandu-neon-data.tgz 2>/dev/null || true
          rm -rf /tmp/sipandu-neon-export /tmp/sipandu-neon-data.enc /tmp/sipandu-key-material.enc /tmp/sipandu-transfer-public.pem
