name: Patch SiPANDU Subdirectory URLs Once

on:
  push:
    branches:
      - work/ui-lms-next-batch
    paths:
      - '.github/workflows/subdirectory-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ui-lms-next-batch
          fetch-depth: 0

      - name: Patch path parsers and static class link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'resources/js/class-quiz.tsx': [
                  (
                      "    const classId = window.location.pathname.split('/').filter(Boolean)[1] ?? '';",
                      "    const pathSegments = window.location.pathname.split('/').filter(Boolean);\n    const classSegment = pathSegments.lastIndexOf('kelas');\n    const classId = classSegment >= 0 ? (pathSegments[classSegment + 1] ?? '') : '';",
                  ),
              ],
              'resources/js/student-progress.tsx': [
                  ("window.location.pathname.match(/^\\/kelas\\/(\\d+)/)", "window.location.pathname.match(/\\/kelas\\/(\\d+)(?:\\/|$)/)"),
              ],
              'resources/js/student-material-checklist.tsx': [
                  ("window.location.pathname.match(/^\\/kelas\\/(\\d+)/)", "window.location.pathname.match(/\\/kelas\\/(\\d+)(?:\\/|$)/)"),
              ],
              'resources/js/join-requests.ts': [
                  ("window.location.pathname.match(/^\\/kelas\\/(\\d+)$/)", "window.location.pathname.match(/\\/kelas\\/(\\d+)(?:\\/|$)/)"),
              ],
              'resources/views/class-journal.blade.php': [
                  ('href="/kelas/{{ $courseClass->id }}"', 'href="{{ route(\'classes.show\', $courseClass) }}"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected pattern not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Audit remaining pathname and direct navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          print('--- window.location.pathname occurrences ---')
          for path in sorted(Path('resources/js').rglob('*')):
              if path.suffix not in {'.ts', '.tsx', '.js'}:
                  continue
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if 'window.location.pathname' in line:
                      print(f'{path}:{number}:{line.strip()}')

          print('--- direct root location assignments ---')
          for path in sorted(Path('resources/js').rglob('*')):
              if path.suffix not in {'.ts', '.tsx', '.js'}:
                  continue
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  compact = line.replace(' ', '')
                  if ('location.href=' in compact or 'location.assign(' in compact or 'location.replace(' in compact) and "'/" in line or ('location.href=' in compact and '`/' in line):
                      print(f'{path}:{number}:{line.strip()}')

          print('--- hardcoded Blade class links ---')
          for path in sorted(Path('resources/views').rglob('*.blade.php')):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if 'href="/kelas/' in line or "href='/kelas/" in line:
                      print(f'{path}:{number}:{line.strip()}')
          PY

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/subdirectory-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/class-quiz.tsx resources/js/student-progress.tsx resources/js/student-material-checklist.tsx resources/js/join-requests.ts resources/views/class-journal.blade.php .github/workflows/subdirectory-patch-once.yml
          git commit -m 'fix: buat parser URL kelas subdirektori-aware'
          git push origin HEAD:work/ui-lms-next-batch
