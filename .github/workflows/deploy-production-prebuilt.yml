name: Deploy SiPANDU Production (Prebuilt)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref yang akan dideploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: sipandu-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build di GitHub dan deploy prebuilt ke Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_SCOPE: andiseppewali-3458s-projects
      VERCEL_PROJECT: sipandumath
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Pastikan VERCEL_TOKEN tersedia
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub Secret VERCEL_TOKEN belum tersedia. Tambahkan token Vercel sekali di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link project Vercel
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build production di GitHub
        run: vercel build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt ke production
        run: vercel deploy --prebuilt --prod --archive=tgz --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verifikasi production
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://sipandumath.vercel.app/healthz; then
              echo
              echo "Production SiPANDU merespons health check."
              exit 0
            fi
            echo "Menunggu production siap... percobaan $attempt/12"
            sleep 5
          done
          echo "::error::Production belum merespons health check setelah deployment."
          exit 1
