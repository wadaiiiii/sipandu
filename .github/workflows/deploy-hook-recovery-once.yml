name: Recovery SiPANDU via Deploy Hook

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-hook-recovery-once.yml'

permissions:
  contents: read

jobs:
  deploy-hook:
    name: Trigger main melalui Vercel Deploy Hook
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: andiseppewali-3458s-projects
      VERCEL_PROJECT: sipandumath
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Pastikan token tersedia
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN tidak tersedia."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Trigger Deploy Hook main yang sudah dibuat
        shell: bash
        run: |
          set -euo pipefail
          hooks_json="$(vercel deploy-hooks ls --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --format json 2>/dev/null)"
          hook_url="$(printf '%s' "$hooks_json" | jq -r '.. | objects | select(.name? == "Deploy Main SiPANDU") | .url? // empty' | tail -n 1)"

          if [ -z "$hook_url" ]; then
            echo "::error::Deploy Hook 'Deploy Main SiPANDU' tidak ditemukan."
            exit 1
          fi

          echo "::add-mask::$hook_url"
          response="$(curl --fail --silent --show-error --max-time 30 -X POST -H 'Content-Type: application/json' --data '{}' "$hook_url")"
          state="$(printf '%s' "$response" | jq -r '.job.state // empty' 2>/dev/null || true)"
          job_id="$(printf '%s' "$response" | jq -r '.job.id // empty' 2>/dev/null || true)"

          if [ -z "$job_id" ]; then
            echo "::error::Deploy Hook dipanggil tetapi Vercel tidak mengembalikan job deployment."
            exit 1
          fi

          echo "Deploy Hook main diterima Vercel. State: ${state:-UNKNOWN}."

      - name: Tunggu antrean deployment terbentuk
        run: sleep 20
