name: Check SiPANDU Deploy Hook Result

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-hook-recovery-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Cek deployment production terbaru
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: andiseppewali-3458s-projects
      VERCEL_PROJECT: sipandumath
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: List production deployments terbaru
        shell: bash
        run: |
          set -euo pipefail
          vercel list "$VERCEL_PROJECT" --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes
