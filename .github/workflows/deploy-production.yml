name: SiPANDU Production Deploy

on:
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: SSH Server Check
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        port: ${{ secrets.SERVER_PORT }}
        key: ${{ secrets.SERVER_SSH_KEY }}

        script: |

          echo "=== SERVER ==="
          hostname
          whoami

          echo "=== PHP ==="
          php -v

          echo "=== COMPOSER ==="
          composer -V

          echo "=== NODE ==="
          node -v
          npm -v

          echo "=== SIPANDU ==="
          ls -la ~/apps/sipandu
