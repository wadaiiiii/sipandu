name: SiPANDU Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy SiPANDU release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            APP=~/apps/sipandu
            RELEASE=$(date +%Y%m%d%H%M%S)

            echo "=== CREATE RELEASE $RELEASE ==="
            mkdir -p $APP/releases

            git clone --depth 1 git@github.com:wadaiiiii/sipandu.git $APP/releases/$RELEASE

            cd $APP/releases/$RELEASE

            echo "=== LINK SHARED FILES ==="
            ln -sfn $APP/shared/.env .env
            rm -rf storage
            ln -sfn $APP/shared/storage storage

            echo "=== COMPOSER ==="
            $HOME/bin/composer install --no-dev --optimize-autoloader

            echo "=== NODE ==="
            export PATH="/opt/alt/alt-nodejs20/root/usr/bin:$PATH"
            which node || true
            which npm || true
            node -v || true
            npm -v || true

            echo "=== NODE BUILD ==="
            npm install
            npm run build

            echo "=== ARTISAN ==="
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            echo "=== SWITCH CURRENT ==="
            ln -sfn $APP/releases/$RELEASE $APP/current

            echo "=== RESTART PHP ==="
            touch ~/tmp/restart.txt

            echo "DEPLOY SUCCESS: $RELEASE"
