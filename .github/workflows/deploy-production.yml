name: SiPANDU Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql


      - name: Composer install
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install frontend dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install


      - name: Build frontend
        run: |
          npm run build


      - name: Create deployment package
        run: |
          tar -czf sipandu-release.tar.gz \
          --exclude=.git \
          --exclude=node_modules \
          .


      - name: Upload release package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: sipandu-release.tar.gz
          target: ~/apps/sipandu/releases



  deploy:

    needs: build

    runs-on: ubuntu-latest


    steps:


      - name: Deploy production release

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}


          script: |

            set -e


            APP=~/apps/sipandu
            RELEASE=$(date +%Y%m%d%H%M%S)


            echo "================================"
            echo " SiPANDU RELEASE $RELEASE"
            echo "================================"


            echo "=== CREATE RELEASE ==="


            mkdir -p $APP/releases/$RELEASE


            tar -xzf \
            $APP/releases/sipandu-release.tar.gz \
            -C $APP/releases/$RELEASE



            cd $APP/releases/$RELEASE



            echo "=== ENVIRONMENT ==="


            ln -sfn \
            $APP/shared/.env \
            .env



            echo "=== STORAGE ==="


            rm -rf storage


            ln -sfn \
            $APP/shared/storage \
            storage



            echo "=== DATABASE MIGRATION ==="


            php artisan migrate --force



            echo "=== OPTIMIZE ==="


            php artisan optimize:clear

            php artisan optimize



            echo "=== SWITCH RELEASE ==="


            ln -sfn \
            $APP/releases/$RELEASE \
            $APP/current



            echo "=== SYNC PUBLIC TO CPANEL ==="


            rsync -av --delete \
            $APP/current/public/ \
            ~/public_html/akademik/sipandu/



            echo "=== VERIFY PUBLIC ==="


            test -f ~/public_html/akademik/sipandu/index.php

            test -f ~/public_html/akademik/sipandu/.htaccess


            echo "PUBLIC OK"



            echo "=== PERMISSION ==="


            chmod 644 \
            ~/public_html/akademik/sipandu/index.php


            chmod 644 \
            ~/public_html/akademik/sipandu/.htaccess



            echo "=== RESTART PHP ==="


            touch ~/tmp/restart.txt



            echo "=== CLEAN OLD RELEASE ==="


            cd $APP/releases


            ls -dt */ | tail -n +4 | xargs -r rm -rf



            echo "================================"
            echo " DEPLOY SUCCESS $RELEASE"
            echo "================================"


        command_timeout: 15m
