name: SiPANDU Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql


      - name: Composer install
        run: |
          composer install \
          --no-dev \
          --prefer-dist \
          --optimize-autoloader


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build


      - name: Create release archive
        run: |
          tar \
          --exclude=.git \
          --exclude=node_modules \
          --exclude=sipandu-release.tar.gz \
          -czf /tmp/sipandu-release.tar.gz .
      
          mv /tmp/sipandu-release.tar.gz sipandu-release.tar.gz

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: sipandu-release.tar.gz
          target: ~/apps/sipandu/releases


      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            set -e

            APP=~/apps/sipandu
            RELEASE=$(date +%Y%m%d%H%M%S)


            mkdir -p $APP/releases/$RELEASE


            tar -xzf \
            $APP/releases/sipandu-release.tar.gz \
            -C $APP/releases/$RELEASE


            cd $APP/releases/$RELEASE


            ln -sfn $APP/shared/.env .env


            rm -rf storage

            ln -sfn $APP/shared/storage storage


            php artisan migrate --force


            php artisan optimize:clear

            php artisan optimize


            ln -sfn \
            $APP/releases/$RELEASE \
            $APP/current


            echo "SYNC PUBLIC"

            rm -rf ~/public_html/akademik/sipandu/build
            rm -rf ~/public_html/akademik/sipandu/icons
            
            cp -R $APP/current/public/* \
            ~/public_html/akademik/sipandu/
            
            
            touch ~/tmp/restart.txt
            
            echo "SiPANDU DEPLOY SUCCESS"
