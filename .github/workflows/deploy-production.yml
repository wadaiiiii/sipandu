name: SiPANDU Production Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql

      - name: Composer install
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install
          npm run build

      - name: Create deployment package
        run: tar -czf sipandu-release.tar.gz --exclude=.git --exclude=node_modules .

      - name: Upload release package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: sipandu-release.tar.gz
          target: ~/apps/sipandu/releases

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP=~/apps/sipandu
            RELEASE=$(date +%Y%m%d%H%M%S)

            mkdir -p $APP/releases/$RELEASE
            tar -xzf $APP/releases/sipandu-release.tar.gz -C $APP/releases/$RELEASE

            cd $APP/releases/$RELEASE

            ln -sfn $APP/shared/.env .env
            rm -rf storage
            ln -sfn $APP/shared/storage storage

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            ln -sfn $APP/releases/$RELEASE $APP/current
            touch ~/tmp/restart.txt

            echo "DEPLOY SUCCESS: $RELEASE"
